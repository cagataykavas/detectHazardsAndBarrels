[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-vision-lab"
version = "1.0.0"
description = "Explainable hazmat placard and colored-barrel tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cagatay Kavas"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
crisis-vision = "crisis_vision.cli:main"

[tool.setuptools.packages.find]
include = ["crisis_vision*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
